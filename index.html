<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Yash Vilas Borse - Personal Portfolio. Aspiring Data Analyst and Data Scientist.">
    <title>Yash Vilas Borse | Portfolio</title>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome and Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0B1020;
            --bg-secondary: #161D32;
            --accent-main: #38BDF8;
            --accent-secondary: #8B5CF6;
            --text-main: #CBD5E1;
            --text-heading: #F8FAFC;
            --border-color: #273449;
            --text-muted: #94A3B8;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --gradient: linear-gradient(135deg, var(--accent-main), var(--accent-secondary));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        h1,
        h2,
        h3,
        h4 {
            color: var(--text-heading);
            font-weight: 700;
            line-height: 1.2;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5%;
        }

        .section-padding {
            padding: 8rem 0;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 4rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 60px;
            height: 4px;
            background: var(--gradient);
            border-radius: 2px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-size: 1rem;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-heading);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--accent-main);
            color: var(--accent-main);
            background: rgba(56, 189, 248, 0.05);
        }

        /* Nav */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(11, 16, 32, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(39, 52, 73, 0.5);
            transition: var(--transition);
        }

        .nav-scrolled {
            background: rgba(11, 16, 32, 0.95);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-heading);
            letter-spacing: 1px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
            transition: var(--transition);
            position: relative;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent-main);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-heading);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 80px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-text h4 {
            color: var(--accent-main);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .hero-text h1 {
            font-size: 4.5rem;
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        .hero-text h2 {
            font-size: 2rem;
            color: var(--text-heading);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .hero-text h3 {
            font-size: 1.2rem;
            color: var(--accent-secondary);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .hero-text p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            max-width: 90%;
        }

        .hero-actions {
            display: flex;
            gap: 1rem;
        }

        .hero-image-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .hero-image-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: var(--gradient);
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: pulse 4s ease-in-out infinite alternate;
        }

        .hero-image {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(0);
            transition: transform 0.5s ease;
        }

        .hero-image:hover {
            transform: translateY(-10px);
            border-color: var(--accent-main);
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1) saturate(1.1);
        }

        /* About Section */
        .bg-secondary {
            background-color: var(--bg-secondary);
        }

        .about-text {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 3rem;
            max-width: 800px;
        }

        .info-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .info-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 2.5rem 2rem;
            border-radius: 12px;
            transition: var(--transition);
        }

        .info-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-main);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .info-card i {
            font-size: 2rem;
            color: var(--accent-main);
            margin-bottom: 1.5rem;
        }

        .info-card h3 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .info-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Skills */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .skill-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: var(--transition);
        }

        .skill-card:hover {
            border-color: var(--accent-secondary);
            transform: scale(1.02);
            background: rgba(139, 92, 246, 0.05);
        }

        .skill-card i {
            font-size: 1.8rem;
            color: var(--accent-main);
        }

        .skill-card span {
            font-weight: 500;
            color: var(--text-heading);
            font-size: 1.1rem;
        }

        /* Projects */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2.5rem;
        }

        .project-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-main);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .project-img {
            height: 200px;
            background: #1e293b;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .project-img i {
            font-size: 4rem;
            color: var(--border-color);
            transition: var(--transition);
        }

        .project-card:hover .project-img i {
            transform: scale(1.1);
            color: var(--accent-secondary);
        }

        .project-status {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(11, 16, 32, 0.8);
            backdrop-filter: blur(4px);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-main);
            border: 1px solid var(--accent-main);
        }

        .project-content {
            padding: 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .project-content h3 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .project-content p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .project-features {
            margin-bottom: 2rem;
            flex: 1;
        }

        .project-features li {
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .project-features li::before {
            content: '▹';
            color: var(--accent-main);
        }

        .project-links {
            display: flex;
            gap: 1rem;
            margin-top: auto;
        }

        .project-link {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-heading);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .project-link:hover {
            color: var(--accent-main);
        }

        /* Education & Experience */
        .timeline-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4rem;
        }

        .timeline-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-main);
            padding: 2rem;
            border-radius: 0 12px 12px 0;
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .timeline-card:hover {
            border-color: var(--accent-main);
            background: rgba(22, 29, 50, 0.5);
        }

        .timeline-title {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--text-heading);
        }

        .timeline-subtitle {
            color: var(--accent-main);
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .timeline-details {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .timeline-details ul {
            margin-top: 1rem;
            padding-left: 1rem;
        }

        .timeline-details li {
            margin-bottom: 0.3rem;
            list-style-type: disc;
        }

        /* Contact */
        .contact-content {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 4rem;
        }

        .contact-info p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            transition: var(--transition);
        }

        .social-link:hover {
            border-color: var(--accent-secondary);
            background: rgba(139, 92, 246, 0.05);
            transform: translateX(5px);
        }

        .social-link i {
            font-size: 1.2rem;
            color: var(--accent-main);
        }

        .contact-form {
            background: var(--bg-secondary);
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-control {
            width: 100%;
            padding: 1rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-heading);
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-main);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .form-feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .form-feedback.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid #22c55e;
        }

        /* Footer */
        footer {
            background: var(--bg-primary);
            padding: 3rem 0;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Animations */
        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0.1;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.2;
            }
        }

        .fade-in-section {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            will-change: opacity, visibility;
        }

        .fade-in-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 992px) {

            .hero-grid,
            .timeline-container,
            .contact-content {
                grid-template-columns: 1fr;
                gap: 3rem;
            }

            .hero-image {
                width: 320px;
                height: 320px;
                margin: 0 auto;
            }

            .hero-text {
                text-align: center;
            }

            .hero-text p {
                margin: 0 auto 2.5rem auto;
            }

            .hero-actions {
                justify-content: center;
            }

            .info-cards {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: block;
            }

            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(11, 16, 32, 0.98);
                flex-direction: column;
                padding: 2rem;
                gap: 1.5rem;
                border-bottom: 1px solid var(--border-color);
                clip-path: circle(0% at top right);
                transition: all 0.4s ease-out;
            }

            .nav-links.nav-open {
                clip-path: circle(150% at top right);
            }

            .hero-text h1 {
                font-size: 3rem;
            }

            .section-title {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Hook for Scroll Animation
        function useFadeIn() {
            const domRef = useRef();
            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            // observer.unobserve(entry.target); // keep it to animate only once, or remove to re-animate
                        }
                    });
                }, { threshold: 0.1 });

                const currentRef = domRef.current;
                if (currentRef) observer.observe(currentRef);
                return () => { if (currentRef) observer.unobserve(currentRef); };
            }, []);
            return domRef;
        }

        const FadeSection = ({ children, className = "" }) => {
            const ref = useFadeIn();
            return (
                <div ref={ref} className={`fade-in-section ${className}`}>
                    {children}
                </div>
            );
        };

        const Navbar = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={isScrolled ? 'nav-scrolled' : ''}>
                    <div className="container nav-content">
                        <a href="#" className="logo">YASH BORSE</a>

                        <button className="mobile-menu-btn" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                            <i className={`fas ${isMenuOpen ? 'fa-times' : 'fa-bars'}`}></i>
                        </button>

                        <ul className={`nav-links ${isMenuOpen ? 'nav-open' : ''}`}>
                            <li><a href="#home" onClick={() => setIsMenuOpen(false)}>Home</a></li>
                            <li><a href="#about" onClick={() => setIsMenuOpen(false)}>About</a></li>
                            <li><a href="#skills" onClick={() => setIsMenuOpen(false)}>Skills</a></li>
                            <li><a href="#projects" onClick={() => setIsMenuOpen(false)}>Projects</a></li>
                            <li><a href="#education" onClick={() => setIsMenuOpen(false)}>Education</a></li>
                            <li><a href="#contact" onClick={() => setIsMenuOpen(false)}>Contact</a></li>
                        </ul>
                    </div>
                </nav>
            );
        };

        const Hero = () => {
            return (
                <section id="home" className="hero">
                    <div className="container hero-grid">
                        <FadeSection className="hero-text">
                            <h4>HELLO, I'M</h4>
                            <h1>YASH BORSE</h1>
                            <h2>Turning Data Into Meaningful Insights.</h2>
                            <h3>BCA Student | Aspiring Data Analyst | Data Science Enthusiast</h3>
                            <p>I enjoy exploring technology, working with data, and building practical projects that solve real-world problems. I am continuously learning and improving my technical skills.</p>

                            <div className="hero-actions">
                                <a href="#projects" className="btn btn-primary">
                                    Explore My Work <i className="fas fa-arrow-right"></i>
                                </a>
                                <a href="#contact" className="btn btn-outline">
                                    Contact Me
                                </a>
                            </div>
                        </FadeSection>

                        <FadeSection className="hero-image-wrapper">
                            <div className="hero-image-bg"></div>
                            <div className="hero-image">
                                <img
                                    src="yash.jpeg"
                                    alt="Yash Vilas Borse Portrait"
                                    onError={(e) => {
                                        // Fallback if image missing
                                        e.target.style.display = 'none';
                                        e.target.parentElement.style.background = 'var(--bg-secondary)';
                                        e.target.parentElement.innerHTML = '<div style="height:100%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:4rem;"><i class="fas fa-user-circle"></i></div>';
                                    }}
                                />
                            </div>
                        </FadeSection>
                    </div>
                </section>
            );
        };

        const About = () => {
            return (
                <section id="about" className="section-padding bg-secondary">
                    <div className="container">
                        <FadeSection>
                            <h2 className="section-title">About Me</h2>
                            <p className="about-text">
                                I'm a BCA student with an interest in programming, data analysis, and data science. I enjoy learning new technologies, exploring datasets, and developing practical projects. My goal is to strengthen my technical skills and grow into a professional who can turn data into useful insights.
                            </p>
                        </FadeSection>

                        <div className="info-cards">
                            <FadeSection className="info-card">
                                <i className="fas fa-book-reader"></i>
                                <h3>Continuous Learning</h3>
                                <p>Dedicated to exploring new algorithms, frameworks, and tools to stay ahead in the rapidly evolving tech landscape.</p>
                            </FadeSection>
                            <FadeSection className="info-card">
                                <i className="fas fa-lightbulb"></i>
                                <h3>Problem Solving</h3>
                                <p>Approaching complex challenges with logical thinking and breaking them down into manageable, actionable steps.</p>
                            </FadeSection>
                            <FadeSection className="info-card">
                                <i className="fas fa-chart-network"></i>
                                <h3>Technology & Data</h3>
                                <p>Passionate about the intersection of software development and data analytics to extract actionable intelligence.</p>
                            </FadeSection>
                        </div>
                    </div>
                </section>
            );
        };

        const Skills = () => {
            const skillsList = [
                { name: "Python", icon: "fab fa-python" },
                { name: "Advanced MS Excel", icon: "fas fa-file-excel" },
                { name: "Data Analysis", icon: "fas fa-chart-bar" },
                { name: "MySQL", icon: "fas fa-database" },
                { name: "Microsoft PowerPoint", icon: "fas fa-file-powerpoint" },
                { name: "Microsoft Excel", icon: "fas fa-file-excel" },
                { name: "Power BI", icon: "fas fa-chart-line" },
                { name: "Data Visualization", icon: "fas fa-chart-pie" },
                { name: "Statistical Analysis", icon: "fas fa-square-root-alt" },
                { name: "Data Cleaning", icon: "fas fa-broom" },
                { name: "English Typing (30-40 WPM)", icon: "fas fa-keyboard" },
                { name: "Java Programming", icon: "fab fa-java" },
                { name: "C Programming", icon: "fas fa-code" },
                { name: "C++", icon: "fas fa-file-code" }
            ];

            return (
                <section id="skills" className="section-padding">
                    <div className="container">
                        <FadeSection>
                            <h2 className="section-title">My Skills</h2>
                        </FadeSection>

                setIsSubmitting(true);
                setStatus('sending');

                const formData = new FormData(e.target);

                // --- SETUP INSTRUCTIONS ---
                // Replace "YOUR_ACCESS_KEY_HERE" with your Web3Forms access key.

                formData.append("access_key", "aa9f4169-e243-452e-a62a-82765bdecf4c");

                try {
                    const response = await fetch("https://api.web3forms.com/submit", {
                        method: "POST",
                        body: formData
                    });

                    const data = await response.json();

                    if (data.success) {
                        setStatus('success');
                        e.target.reset();
                    } else {
                        console.error("Form Error", data);
                        setStatus('error');
                    }
                } catch (error) {
                    console.error("Submission Error", error);
                    setStatus('error');

                    setIsSubmitting(false);
                    setTimeout(() => setStatus(''), 5000);
